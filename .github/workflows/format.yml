name: Auto-Format Python Code

on: [push]

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Optional: If using a PAT, ensure checkout uses it too
          token: ${{ secrets.CUSTOM_PAT_TOKEN }}

      - name: Run Black Formatter
        uses: rickstaa/action-black@v1
        id: action_black
        with:
          black_args: "."

      - name: Push formatted code back to repo
        if: steps.action_black.outputs.is_formatted == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.CUSTOM_PAT_TOKEN }}
          title: "Auto-format Python code with Black"
          commit-message: "Style: auto-formatted by Black"
          branch: actions/black
          signoff: true
          
